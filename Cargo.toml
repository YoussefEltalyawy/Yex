[workspace]
resolver = "2"
members = ["src-tauri", "crates/yex-core", "crates/yex-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
yex-core = { path = "crates/yex-core" }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v7"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
anyhow = "1.0.104"
thiserror = "2.0.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
