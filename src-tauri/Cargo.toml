[package]
name = "yex"
version.workspace = true
edition.workspace = true
description = "YEX - your life dashboard"

[lib]
name = "yex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
yex-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
